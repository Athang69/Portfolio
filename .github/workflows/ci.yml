name: CI

on:
  push:
    branches: [Main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
        env:
          # Lets the stats sync use the authenticated GitHub rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
